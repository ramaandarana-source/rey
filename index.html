<style>
  @import url('https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@400;600;700&display=swap');
  @keyframes gradient-animation {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  @keyframes scanline-animation {
    0% { top: -10%; }
    100% { top: 110%; }
  }
  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  .animate-spin-slow {
    animation: spin 2s linear infinite;
  }
  body {
    background: linear-gradient(-45deg, #020617, #082f49, #0f172a, #312e81);
    background-size: 400% 400%;
    animation: gradient-animation 15s ease infinite;
  }
  /* Custom Scrollbar */
  ::-webkit-scrollbar {
    width: 8px;
  }
  ::-webkit-scrollbar-track {
    background: #0f172a;
  }
  ::-webkit-scrollbar-thumb {
    background-color: #0ea5e9;
    border-radius: 10px;
    border: 2px solid #0f172a;
  }
  ::-webkit-scrollbar-thumb:hover {
    background-color: #38bdf8;
  }
  /* Custom Range Slider */
  input[type=range].styled-slider {
    -webkit-appearance: none;
    width: 100%;
    background: transparent;
  }
  input[type=range].styled-slider:focus {
    outline: none;
  }
  input[type=range].styled-slider::-webkit-slider-runnable-track {
    width: 100%;
    height: 6px;
    cursor: pointer;
    background: #1e293b;
    border-radius: 5px;
  }
  input[type=range].styled-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    height: 18px;
    width: 18px;
    border-radius: 50%;
    background: #0ea5e9;
    cursor: pointer;
    margin-top: -6px;
    box-shadow: 0 0 10px #0ea5e9, 0 0 5px #0ea5e9;
    transition: transform 0.1s ease-out;
  }
  input[type=range].styled-slider:active::-webkit-slider-thumb {
    transform: scale(1.2);
  }
  input[type=range].styled-slider::-moz-range-track {
    width: 100%;
    height: 6px;
    cursor: pointer;
    background: #1e293b;
    border-radius: 5px;
  }
  input[type=range].styled-slider::-moz-range-thumb {
    height: 18px;
    width: 18px;
    border-radius: 50%;
    background: #0ea5e9;
    cursor: pointer;
    box-shadow: 0 0 10px #0ea5e9, 0 0 5px #0ea5e9;
  }
  /* Panel Glow Effect */
  .panel-glow {
    box-shadow: 0 0 15px rgba(14, 165, 233, 0.1), 0 0 30px rgba(14, 165, 233, 0.05);
  }
  /* Scanline Animation for Image Preview */
  .scanline-overlay {
    content: '';
    position: absolute;
    left: 0;
    width: 100%;
    height: 4px;
    background: rgba(14, 165, 233, 0.7);
    box-shadow: 0 0 10px 2px rgba(14, 165, 233, 0.5);
    border-radius: 2px;
    animation: scanline-animation 2s infinite ease-in-out;
    pointer-events: none;
  }
  /* Button Glow Effects */
  .glow-transition {
    transition: box-shadow 0.2s ease-out;
  }
  .action-glow:active, .active-glow {
    box-shadow: 0 0 5px 0.5px rgba(14, 165, 233, 0.3);
  }

  /* Glitch Effect for Header */
  .glitch-wrapper {
    position: relative;
  }
  .glitch {
    position: relative;
    color: #e2e8f0; /* slate-200 */
    text-shadow: 0 0 5px #0ea5e9, 0 0 10px #0ea5e9;
  }
  .glitch::before,
  .glitch::after {
    content: attr(data-text);
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
  }
  .glitch::before {
    left: 2px;
    text-shadow: -1px 0 #ef4444; /* red-500 */
    animation: glitch-anim-1 2.5s infinite linear alternate-reverse;
  }
  .glitch::after {
    left: -2px;
    text-shadow: -1px 0 #3b82f6; /* blue-500 */
    animation: glitch-anim-2 2s infinite linear alternate-reverse;
  }
  @keyframes glitch-anim-1 {
    0% { clip-path: inset(10% 0 80% 0); }
    20% { clip-path: inset(50% 0 25% 0); }
    40% { clip-path: inset(20% 0 40% 0); }
    60% { clip-path: inset(85% 0 5% 0); }
    80% { clip-path: inset(45% 0 45% 0); }
    100% { clip-path: inset(70% 0 10% 0); }
  }
  @keyframes glitch-anim-2 {
    0% { clip-path: inset(80% 0 5% 0); }
    20% { clip-path: inset(15% 0 70% 0); }
    40% { clip-path: inset(60% 0 30% 0); }
    60% { clip-path: inset(25% 0 65% 0); }
    80% { clip-path: inset(90% 0 2% 0); }
    100% { clip-path: inset(55% 0 35% 0); }
  }
  
  /* SweetAlert2 Dark Theme Customization */
  .swal2-container.swal2-backdrop-show {
      background: rgba(2, 6, 23, 0.8) !important;
      backdrop-filter: blur(4px);
  }
  .swal2-popup {
    background: #0f172a !important; /* slate-900 */
    border: 1px solid #1e293b !important; /* slate-800 */
    color: #e2e8f0 !important; /* slate-200 */
    border-radius: 0.75rem !important;
  }
  .swal2-title {
    color: #e2e8f0 !important;
  }
  .swal2-html-container {
    color: #94a3b8 !important; /* slate-400 */
    margin: 0 !important;
    padding: 0 !important;
  }
  .swal2-close {
    color: #94a3b8 !important;
  }
  .swal2-close:hover {
    color: #e2e8f0 !important;
  }

  select.ffmpeg-select option { background: #0f172a; color: #94a3b8; }
